name: Silver stress tracker

on:
  schedule:
    - cron: "17 22 * * 1-5" # weekdays after the COMEX close
  workflow_dispatch:
  push:
    paths: ["tracker/**", "tests/**", "data/manual.json", ".github/workflows/silver-tracker.yml"]

permissions:
  contents: write

concurrency:
  group: silver-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python -m tracker
        timeout-minutes: 8
      - name: Commit updated data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv reports/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update silver tracker $(date -u +%F)"
            git push
          fi
